# Render Blueprint for the API + Socket.IO server (Dashboard → New → Blueprint)
services:
  - type: web
    name: pulse-server
    runtime: node
    rootDir: server
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: TURN_URLS
        sync: false
      - key: TURN_SECRET
        sync: false
