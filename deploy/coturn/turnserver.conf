# /etc/turnserver.conf  — production coturn for Pulse
# Replace turn.example.com, YOUR_PUBLIC_IP, and the secret. Generate a secret with:
#   openssl rand -hex 32
listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0
# If the VPS is behind NAT (AWS/GCP/Azure) set  external-ip=PUBLIC_IP/PRIVATE_IP
external-ip=YOUR_PUBLIC_IP
min-port=49160
max-port=49200

fingerprint
use-auth-secret
static-auth-secret=REPLACE_WITH_LONG_RANDOM_SECRET   # == TURN_SECRET in the backend env
realm=turn.example.com
server-name=turn.example.com

# TLS (Let's Encrypt:  certbot certonly --standalone -d turn.example.com)
cert=/etc/letsencrypt/live/turn.example.com/fullchain.pem
pkey=/etc/letsencrypt/live/turn.example.com/privkey.pem
no-tlsv1
no-tlsv1_1

total-quota=100
stale-nonce=600
no-multicast-peers
no-cli

# Block relaying into private networks (SSRF protection)
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
